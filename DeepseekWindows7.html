        { separator: true },
        { id: 'notepad', label: 'Bloc de notas', icon: '📝' },
        { id: 'calculator', label: 'Calculadora', icon: '🧮' },
        { id: 'cmd', label: 'Símbolo del sistema', icon: '⬛' },
        { id: 'taskmgr', label: 'Administrador de tareas', icon: '📊' },
        { id: 'controlPanel', label: 'Panel de control', icon: '⚙️' },
        { separator: true },
        { id: 'taskmgr', label: 'Administrador de tareas', icon: '📊' }
    ];

    menuItems.forEach(item => {
        if (item.separator) {
            const sep = document.createElement('div');
            sep.style.cssText = 'height:1px;background:rgba(100,160,220,0.3);margin:4px 12px;';
            programsContainer.appendChild(sep);
        } else {
            const el = document.createElement('div');
            el.className = 'start-item';
            el.innerHTML = `<span class="si-icon">${item.icon}</span><span class="si-text">${item.label}</span>`;
            el.addEventListener('click', () => {
                openApp(item.id);
                startMenu.classList.remove('open');
                startButton.classList.remove('active');
            });
            programsContainer.appendChild(el);
        }
    });

    // Toggle del menú
    startButton.addEventListener('click', (e) => {
        e.stopPropagation();
        startMenu.classList.toggle('open');
        startButton.classList.toggle('active');
        if (startMenu.classList.contains('open')) {
            soundEngine.playClick();
        }
    });

    // Cerrar al hacer clic fuera
    document.addEventListener('click', (e) => {
        if (!startMenu.contains(e.target) && !startButton.contains(e.target)) {
            startMenu.classList.remove('open');
            startButton.classList.remove('active');
        }
    });

    // Cerrar con Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            startMenu.classList.remove('open');
            startButton.classList.remove('active');
            hideContextMenu();
        }
    });
}

// ==================== RELOJ ====================
function updateClock() {
    const now = new Date();
    const timeEl = document.getElementById('clock-time');
    const dateEl = document.getElementById('clock-date');

    if (timeEl) {
        timeEl.textContent = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    if (dateEl) {
        dateEl.textContent = now.toLocaleDateString('es-ES');
    }
}

// ==================== MENÚ CONTEXTUAL DEL ESCRITORIO ====================
function setupDesktopContextMenu() {
    const desktop = document.getElementById('desktop');

    desktop.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.desktop-icon')) return;
        e.preventDefault();

        showContextMenu(e.clientX, e.clientY, [
            { label: 'Ver', action: () => {} },
            { label: 'Ordenar por', action: () => {} },
            { label: 'Actualizar', action: () => { createDesktopIcons(); } },
            { separator: true },
            { label: 'Nueva carpeta', action: () => {
                const name = prompt('Nombre de la carpeta:', 'Nueva carpeta');
                if (name) {
                    vfs.addNode('desktop', { id: 'folder_' + Date.now(), name: name, type: 'folder', children: [] });
                    storageManager.updateUsed();
                    createDesktopIcons();
                }
            }},
            { label: 'Nuevo documento de texto', action: () => {
                const name = prompt('Nombre del archivo:', 'nuevo.txt');
                if (name) {
                    vfs.addNode('desktop', { id: 'file_' + Date.now(), name: name, type: 'file', content: '', size: 256, modified: Date.now() });
                    storageManager.updateUsed();
                    createDesktopIcons();
                }
            }},
            { separator: true },
            { label: 'Personalizar', action: () => openControlPanel() }
        ]);
    });
}

// ==================== INICIALIZACIÓN ====================
let systemStartTime = Date.now();

function init() {
    // Cargar preferencias
    const savedSound = localStorage.getItem('win7_sound_enabled');
    if (savedSound !== null) soundEngine.enabled = savedSound === 'true';

    const savedWallpaper = localStorage.getItem('win7_wallpaper');
    if (savedWallpaper) {
        document.getElementById('desktop').style.backgroundImage = `url(${savedWallpaper})`;
    }

    // Crear iconos del escritorio
    createDesktopIcons();

    // Configurar menú de inicio
    setupStartMenu();

    // Configurar menú contextual del escritorio
    setupDesktopContextMenu();

    // Reloj
    updateClock();
    setInterval(updateClock, 1000);

    // Actualizar stats de procesos periódicamente
    setInterval(() => {
        processManager.updateStats();
        storageManager.updateUsed();
    }, 3000);

    // Mostrar escritorio
    document.getElementById('show-desktop').addEventListener('click', () => {
        Object.keys(windowManager.getAllWindows()).forEach(id => {
            windowManager.minimizeWindow(id);
        });
    });

    // Sonido de inicio (requiere interacción del usuario)
    const playStartupOnce = () => {
        soundEngine.playStartup();
        document.removeEventListener('click', playStartupOnce);
        document.removeEventListener('keydown', playStartupOnce);
    };
    document.addEventListener('click', playStartupOnce);
    document.addEventListener('keydown', playStartupOnce);

    // Abrir explorador de archivos al inicio
    setTimeout(() => {
        openExplorer('root');
    }, 600);

    console.log('%c Windows 7 Simulator — Iniciado ', 'background:#2a6aaa;color:#fff;font-size:16px;padding:4px 12px;border-radius:4px;');
    console.log('Disco: ' + DISK_TOTAL_GB + ' GB | RAM: ' + RAM_TOTAL_MB + ' MB');
    console.log('Procesos: ' + processManager.getProcessCount());
}

// Iniciar cuando el DOM esté listo
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
